name: Fetch removed S&P 500 stocks

# Run by hand (Actions → Fetch removed S&P 500 stocks → Run workflow). Places no orders.
# Saves past S&P 500 membership and prices of stocks that left the index, for survivorship-free backtests.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Start date of the history"
        type: string
        default: "2019-01-01"

permissions:
  contents: write

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch membership history and removed stocks' prices
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FROM: ${{ inputs.from }}
        run: python tools/fetch_removed.py --from "$FROM"
      - name: Save to the repository
        run: |
          git config user.name "paper-trader"
          git config user.email "paper-trader@users.noreply.github.com"
          git add data/sp500_history.csv data/removed
          git diff --cached --quiet || git commit -m "Removed S&P 500 stocks $(date -u +%F)"
          git pull --rebase --quiet || true
          git push
